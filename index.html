function setR(r, btn) {
  curR = r;
  var btns = document.querySelectorAll('.reg-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].setAttribute('aria-pressed','false');
    btns[i].style.background = '#fff';
    btns[i].style.color = '#333';
    btns[i].style.border = '1px solid #ccc';
  }
  btn.setAttribute('aria-pressed','true');
  btn.style.background = '#2F7C73';
  btn.style.color = '#fff';
  btn.style.border = '1.5px solid #2F7C73';
  render();
}

function setF(f, btn) {
  curF = f;
  var btns = document.querySelectorAll('.form-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].setAttribute('aria-pressed','false');
    btns[i].style.background = '#fff';
    btns[i].style.color = '#333';
    btns[i].style.border = '1px solid #ccc';
  }
  btn.setAttribute('aria-pressed','true');
  btn.style.background = '#2C5E8A';
  btn.style.color = '#fff';
  btn.style.border = '1.5px solid #2C5E8A';
  render();
}

function render() {
  var item = DATA[curR] && DATA[curR][curF];
  if(!item) { document.getElementById('title').innerText = R_NAMES[curR] + '：' + F_NAMES[curF]; document.getElementById('desc').innerText = '此區域尚未設定峽灣範例，請選擇其他大洲。'; document.getElementById('gmap').src = 'https://maps.google.com/maps?q=' + encodeURIComponent(R_NAMES[curR]) + '&t=k&z=5&output=embed'; return; }
  var fName = F_NAMES[curF];
  var rName = R_NAMES[curR];
  document.getElementById('title').innerText = item.name + ' (' + fName + ') 🔊';
  document.getElementById('desc').innerText = item.desc;
  
  var zLevel = item.z || 8;
  document.getElementById('gmap').src = 'https://maps.google.com/maps?q=' + encodeURIComponent(item.q) + '&t=k&z=' + zLevel + '&output=embed';
  speak();
}

function speak() {
  var item = DATA[curR] && DATA[curR][curF];
  if(!item || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  
  var text = F_NAMES[curF] + '。這是' + R_NAMES[curR] + '的' + item.name + '。' + item.desc;
  
  // 修正發音：將「地峽」轉為同音字「第峽」，確保精準讀出四聲
  var speechText = text.replace(/地峽/g, '第峽');
  
  var msg = new SpeechSynthesisUtterance(speechText);
  msg.lang = 'zh-TW';
  msg.rate = 0.9;
  window.speechSynthesis.speak(msg);
}
